services:
  mysql:
    image: mysql:8.4
    container_name: inventario_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: inventario
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - inventario_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: inventario_backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/inventario"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      COOKIE_NAME: inventario_token
      FRONTEND_URL: ${FRONTEND_URL}

  frontend:
    build:
      context: ./frontend
    container_name: inventario_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:3000:80"

volumes:
  inventario_mysql_data: